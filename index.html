der-radius:3px;position:absolute;inset:8px 6px 14px}#rotate p{letter-spacing:.5px;text-shadow:0 0 12px #000000e6;margin:0;font-size:17px;line-height:1.65}#rotate b{color:#ffd27a;font-weight:600}#rotate small{color:#a9a5c4;letter-spacing:.5px;font-size:12.5px}@keyframes pc-rot{0%,25%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}to{transform:rotate(0)}}@media (prefers-reduced-motion:reduce){#rotate .phone{animation:none;transform:rotate(-90deg)}}</style>
