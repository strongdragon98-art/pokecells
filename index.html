<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 홈 화면에 추가(PWA): 아이폰 사파리의 주소창·하단 바 없이 전체화면 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="포켓셀">
  <meta name="theme-color" content="#07060f">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./pwa/icon-192.png">
  <link rel="apple-touch-icon" href="./pwa/apple-touch-icon.png">
  <title>포켓 셀즈</title>
  <script>
    // 안전 장치 (모듈보다 먼저 실행): ① 지난 접속이 부팅·게임 시작 직후에 끊겼으면(아이폰 WebKit 메모리 크래시 → 자동 새로고침) 안전 모드로
    //  ② 예전에 등록된 서비스 워커가 있으면 해제한다 (옛 파일과 섞여 무한 새로고침에 빠지지 않게 · 이 게임은 서비스 워커를 쓰지 않는다)
    (function () {
      try {
        var now = Date.now(), at = +localStorage.getItem('pokecells.bootAt') || 0;
        if (at && now - at < 180000) localStorage.setItem('pokecells.safe', '1');
        localStorage.setItem('pokecells.bootAt', String(now));
        // 직접 새로고침·창 닫기처럼 정상으로 떠날 때는 표시를 지운다 (튕긴 탭은 pagehide 가 오지 않는다)
        window.addEventListener('pagehide', function () { try { localStorage.removeItem('pokecells.bootAt'); } catch (e) { /* 무시 */ } });
      } catch (e) { /* 사생활 보호 모드 등 저장소를 못 쓰면 건너뜀 */ }
      try {
        // 같은 github.io 주소의 다른 프로젝트는 건드리지 않도록, 이 게임 경로에 걸린 것만
        var here = location.pathname.replace(/[^/]*$/, '');
        if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (new URL(r.scope).pathname.indexOf(here) === 0) r.unregister(); }); }).catch(function () {});
      } catch (e) { /* 무시 */ }
    })();
  </script>
  <style>
    /* 아이폰: 끌려 내려가는 화면 · 두 번 탭 확대 · 텍스트 선택 돋보기를 원천 차단. 높이는 주소창을 뺀 실제 보이는 높이 (--app-h 는 systems/Mobile.js 가 갱신) */
    html, body { margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh; height: var(--app-h, 100dvh); overflow: hidden; background-color: #000; touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    /* 게임 캔버스는 노치(다이내믹 아일랜드)·홈 바를 피한 안전 영역 안에서 16:9 로 맞춘다 (Phaser Scale.FIT) */
    #game { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      display: flex; align-items: center; justify-content: center; }
    #game canvas { image-rendering: auto; }   /* 캔버스가 이미 고해상도라 부드럽게 맞춘다 */
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #b8b0e8; font: 16px 'Galmuri11', monospace; letter-spacing: 1px; }

    /* 세로 모드 안내 (할로우 나이트풍: 어둠 위 상아색 글자 · 흐려지는 가는 선 · 마름모) — 휴대폰을 세로로 들었을 때만 */
    #rotate { display: none; position: fixed; inset: 0; z-index: 40; align-items: center; justify-content: center; padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      background: radial-gradient(ellipse at 50% 42%, #1a1430 0%, #07060f 62%, #000 100%); color: #efeae0; text-align: center;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    #rotate .card { max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    #rotate .line { position: relative; width: 240px; height: 1px; background: linear-gradient(90deg, transparent, rgba(239,234,224,.75), transparent); }
    #rotate .line::before, #rotate .line::after { content: ''; position: absolute; top: -3px; width: 6px; height: 6px; background: #efeae0; transform: rotate(45deg); }
    #rotate .line::before { left: 18px; } #rotate .line::after { right: 18px; }
    #rotate .phone { width: 46px; height: 78px; border: 2px solid #efeae0; border-radius: 9px; position: relative; box-shadow: 0 0 22px rgba(176,138,255,.35); animation: pc-rot 2.4s ease-in-out infinite; }
    #rotate .phone::after { content: ''; position: absolute; left: 50%; bottom: 6px; width: 14px; height: 2px; margin-left: -7px; border-radius: 2px; background: rgba(239,234,224,.7); }
    #rotate .phone::before { content: ''; position: absolute; inset: 8px 6px 14px; border-radius: 3px; background: linear-gradient(160deg, rgba(176,138,255,.35), rgba(255,90,140,.18)); }
    #rotate p { margin: 0; font-size: 17px; line-height: 1.65; letter-spacing: .5px; text-shadow: 0 0 12px rgba(0,0,0,.9); }
    #rotate b { color: #ffd27a; font-weight: 600; }
    #rotate small { font-size: 12.5px; color: #a9a5c4; letter-spacing: .5px; }
    @keyframes pc-rot { 0%, 25% { transform: rotate(0deg); } 55%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
    @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
  </style>
</head>
<body>
  <div id="boot">불러오는 중…</div>
  <div id="game"></div>
  <div id="rotate" role="status" aria-live="polite">
    <div class="card">
      <div class="line"></div>
      <div class="phone" aria-hidden="true"></div>
      <p>📱 원활한 플레이를 위해<br><span class="who">아이폰</span>을 <b>가로(Landscape)</b>로 돌려주세요</p>
      <small>가로로 돌리면 바로 이어서 플레이할 수 있어요</small>
      <div class="line"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
